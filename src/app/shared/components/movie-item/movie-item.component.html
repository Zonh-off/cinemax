<div class="relative group transition-transform duration-300 active:scale-95">
  <div class="aspect-[2/3] overflow-hidden rounded-lg ">
    <img
      [src]="movie().posterPath"
      [alt]="movie().title"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110"
    />

    <ion-button
      fill="clear"
      class="absolute top-0 left-0"
    >
      <ion-icon [name]="isWishlisted ? 'heart' : 'heart-outline'"></ion-icon>
    </ion-button>

    <span class="absolute top-4 right-4 bg-yellow-500 text-black text-sm font-bold px-2 py-0.5 rounded-lg uppercase tracking-wider">
      {{ movie().voteAverage }}
    </span>
  </div>

  <div class="flex-1">
    <h3 class="font-bold text-lg leading-tight line-clamp-1">
      {{ movie().title }}
    </h3>

    <div class="flex pt-1">
      <ion-button
        shape="round"
        fill="outline"
        class="text-black py-2 rounded-lg text-sm font-bold *:active:text-black"
      >
        <ion-text color="primary">
          Book Now
        </ion-text>
      </ion-button>
    </div>
  </div>
</div>
