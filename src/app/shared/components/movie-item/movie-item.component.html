<div
  type="button"
  class="transition-transform duration-300 active:scale-95"
  [routerLink]="['/movies', movie().movieId]">
  <div class="aspect-[2/3] overflow-hidden rounded-lg ">
    <img
      [src]="movie().posterPath"
      [alt]="movie().movieTitle"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110"
    />
  </div>

  <ion-card-content style="
      padding-left: 0 !important;
      padding-right: 0 !important;
      padding-bottom: 0 !important;">
    <ion-card-title>
      {{ movie().movieTitle }}
    </ion-card-title>

    <ion-button shape="round" fill="outline" class="py-2 font-bold w-full">
      Book Now
    </ion-button>
  </ion-card-content>
</div>
