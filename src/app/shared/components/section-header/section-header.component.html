<div class="flex flex-row items-center justify-between mb-2">
  <ion-title role="heading" aria-level="2" class="text-2xl font-semibold">
    {{ title() }}
  </ion-title>
  @if (routerUrl()){
    <ion-button fill="clear" [routerLink]="routerUrl()">
      <ion-text class="flex flex-row items-center gap-1 text-sm font-semibold">
        View All
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </ion-text>
    </ion-button>
  }
</div>
