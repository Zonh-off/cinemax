<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="font-bold">Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="flex flex-col gap-2">
    <div class="flex flex-row items-center gap-2">
      <img src="https://placehold.co/64x64" alt="avatar" class="rounded-full">
      <div class="flex flex-col">
        <ion-text class="font-semibold">
          {{ accountService.currentUser()?.email }}
        </ion-text>
        <ion-text>
          {{ accountService.currentUser()?.email }}
        </ion-text>
      </div>
    </div>

    <ion-list>
      <ion-item-group>
        <ion-button fill="ghost" shape="default" class="flex flex-row align-middle">
          <ion-icon name="heart-outline" class="w-6 h-6 pr-3"></ion-icon>
          <ion-label class="w-full text-start font-semibold">
            Label
          </ion-label>
          <ion-icon name="chevron-forward-outline" class="w-6 h-6"></ion-icon>
        </ion-button>
      </ion-item-group>

      <ion-item-group>
        <ion-item-divider>
          <ion-label> Item Divider </ion-label>
        </ion-item-divider>

        <ion-button fill="ghost" shape="default" class="flex flex-row align-middle">
          <ion-icon name="heart-outline" class="w-6 h-6 pr-3"></ion-icon>
          <ion-label class="w-full text-start font-semibold">
            Label
          </ion-label>
          <ion-icon name="chevron-forward-outline" class="w-6 h-6"></ion-icon>
        </ion-button>
        <ion-button fill="ghost" shape="default" class="flex flex-row align-middle">
          <ion-icon name="heart-outline" class="w-6 h-6 pr-3"></ion-icon>
          <ion-label class="w-full text-start font-semibold">
            Label
          </ion-label>
          <ion-icon name="chevron-forward-outline" class="w-6 h-6"></ion-icon>
        </ion-button>
        <ion-button fill="ghost" shape="default" class="flex flex-row align-middle">
          <ion-icon name="heart-outline" class="w-6 h-6 pr-3"></ion-icon>
          <ion-label class="w-full text-start font-semibold">
            Label
          </ion-label>
          <ion-icon name="chevron-forward-outline" class="w-6 h-6"></ion-icon>
        </ion-button>
      </ion-item-group>

      <ion-item-group>
        <ion-item-divider>
          <ion-label> Item Divider </ion-label>
        </ion-item-divider>

        <ion-button
          fill="ghost"
          shape="default"
          color="primary"
          class="flex flex-row align-middle"
          (click)="onLogout()"
        >
          <ion-icon color="primary" name="exit-outline" class="w-6 h-6 pr-3"></ion-icon>
          <ion-label color="primary" class="w-full text-start font-semibold">
            Log out
          </ion-label>
        </ion-button>
      </ion-item-group>
    </ion-list>

  </div>
</ion-content>
