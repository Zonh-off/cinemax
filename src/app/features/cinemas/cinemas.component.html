<app-cinema-header></app-cinema-header>

<ion-content class="ion-padding">
  <ion-list lines="inset">
    @for (cinema of cinemas(); track cinema.id){
      <ion-item detail="true" [button]="true" [routerLink]="['/cinemas', cinema.id]">
        <ion-text class="pb-2">
          <h3 class="font-bold text-lg">{{ cinema.name }}</h3>
          <p class="text-xs text-slate-400">{{ cinema.address }}</p>
        </ion-text>
      </ion-item>
    }
  </ion-list>
</ion-content>
