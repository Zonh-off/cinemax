<ion-header class="ion-no-border">
  <ion-toolbar class="text-center">
    <ion-title>Now playing</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <div class="flex flex-row justify-between items-center px-4 py-2 cursor-pointer w-full"
         (click)="openCityModal()">
      <div class="p-2">
        <ion-icon name="location-outline" class="text-2xl"></ion-icon>
      </div>
      <div class="flex flex-row justify-between items-center w-full">
        <span class="tracking-tighter text-slate-400 font-medium">Your Location</span>
        <div class="flex flex-row items-center gap-2">
          <span class="text-base font-semibold">{{ this.cityService.selectedCity()?.name || "Loading" }}</span>
          <ion-icon name="chevron-down-outline" color="primary"></ion-icon>
        </div>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="space-y-4">
    @for (cinema of cinemas(); track cinema.id){
      <div class="p-4 flex flex-row items-center justify-between border-b border-slate-400">
        <div class="flex flex-col">
          <h3 class="font-bold text-lg">{{ cinema.name }}</h3>
          <p class="text-xs text-slate-400">{{ cinema.address }}</p>
        </div>
        <ion-icon name="chevron-forward" class="text-slate-300"></ion-icon>
      </div>
    }
  </div>
</ion-content>
