<div class="flex gap-5">
  <div class="w-1/2">
    <img [src]="movie().posterPath"
         [alt]="movie().title"
         class="aspect-[2/3] w-full object-cover rounded-2xl">
  </div>

  <div class="flex flex-col w-1/2">
    <h1 class="text-2xl font-black leading-tight mb-4">{{ movie().title }}</h1>

    <div class="space-y-3">
      <div class="grid grid-cols-[70px_10px_1fr] gap-y-2 text-sm items-start">

        <span class="text-gray-500">Duration</span>
        <span class="text-gray-400">:</span>
        <span class="font-medium">{{ movie().runtime }} min</span>

        <span class="text-gray-500">Director</span>
        <span class="text-gray-400">:</span>
        <span class="font-medium truncate">{{ movie().director }}</span>

        <span class="text-gray-500">Rating</span>
        <span class="text-gray-400">:</span>
        <span class="font-bold text-red-500">{{ movie().voteAverage }}</span>

        <span class="text-gray-500">Genres</span>
        <span class="text-gray-400">:</span>
        <div class="flex flex-wrap gap-1">
          @for (genre of movie().genres; track $index){
            <span class="text-xs bg-gray-100 px-2 py-0.5 rounded">{{ genre }}</span>
          } @empty {
            <span class="text-xs text-gray-400">No genres specified</span>
          }
        </div>
      </div>
    </div>
  </div>
</div>
