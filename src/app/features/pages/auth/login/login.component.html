<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="flex flex-col items-start">
    <ion-text>
      <h1>Welcome back</h1>
    </ion-text>
    <ion-text>
      <p class="text-gray-500">Please enter your email & password to sign in.</p>
    </ion-text>
  </div>

  <div class="mt-6">
    <form [formGroup]="loginForm" class="flex flex-col gap-4">

      <app-input
        label="Email"
        type="email"
        formControlName="email"
      ></app-input>

      <app-input
        label="Password"
        type="password"
        formControlName="password"
      ></app-input>

      <div class="flex justify-end w-full">
        <a routerLink="/auth/forgot-password" class="text-sm font-semibold text-primary no-underline">
          Forgot Password?
        </a>
      </div>
    </form>

    <div class="flex flex-col gap-8 mt-10">
      <div class="flex gap-2 justify-center">
        <span>Don't have an account?</span>
        <a routerLink="/auth/register" class="font-semibold">Sign up</a>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer [translucent]="true" class="ion-no-border ion-padding border-t border-gray-200">
    <ion-button
      class="w-full"
      color="primary"
      fill="solid"
      shape="round"
      [disabled]="!this.loginForm.valid"
      (click)="onLogin()">
      <ion-label class="py-6">Sign in</ion-label>
    </ion-button>
</ion-footer>
